# CI Pipeline — Keystone Platform
#
# Responsibilities:
#   - Secret scanning on every PR (repo-wide, first gate)
#   - Per-service compilation checks (second gate)
#   - Per-service test runs (third gate)
#   - Per-service Docker image builds on merge to main (post-merge, phase 1)
#
# Gate order per service:
#   secret-scan → <service>-compile → <service>-tests → merge → <service>-docker
#
# Docker builds will be promoted to a pre-merge gate in phase 2
# once Dockerfiles contain real build definitions.
#
# See ADR-011 for CI/CD pipeline decisions.
# See ADR-013 for monorepo path-trigger strategy.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Gate order per service:
  #   pr-title-check ─┐
  #                   ├── both required before merge
  #   secret-scan ────┘
  #       → <service>-compile
  #           → <service>-tests
  #               → merge
  #                   → <service>-docker

  # ── PR Title Check ──────────────────────────────────────────────
  # Validates PR title follows conventional commit format.
  # Runs independently — does not gate secret scanning.
  # See CONTRIBUTING.md for commit and PR title conventions.

  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|adr|ci|chore|refactor|test)(\(.+\))?: .+$'; then
            echo "PR title '$TITLE' does not follow conventional commit format"
            echo "Expected format: <type>(<scope>): <description>  (scope is optional)"
            echo "Valid types: feat, fix, docs, adr, ci, chore, refactor, test"
            exit 1
          fi
          echo "PR title '$TITLE' follows convention"

  # ── Secret Scanning ─────────────────────────────────────────────
  # Runs on every PR regardless of which service changed.
  # Service compile and test jobs depend on this passing.
  # See ADR-011 for secret scanning rationale.

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event_name == 'push' && github.event.after || 'HEAD' }}
          extra_args: --only-verified

  # ── KMS ───────────────────────────────────────────────────────────────────
  # Gate chain: secret-scan → kms-compile → kms-tests → merge → kms-docker
  # Triggered only when KMS service files change.
  # Language: Scala / sbt
  # See ADR-009 for language selection rationale.

  kms-compile:
    name: KMS Compile
    runs-on: ubuntu-latest
    needs: secret-scan
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/kms')
    defaults:
      run:
        working-directory: services/kms
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile KMS
        run: echo "sbt compile — placeholder until build.sbt is defined"

  kms-tests:
    name: KMS Tests
    runs-on: ubuntu-latest
    needs: kms-compile
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/kms')
    defaults:
      run:
        working-directory: services/kms
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run KMS tests
        run: echo "KMS tests will run here — placeholder until implementation begins"

  kms-docker:
    name: KMS Docker Build
    runs-on: ubuntu-latest
    needs: kms-tests
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build KMS Docker image
        run: |
          echo "Docker build for KMS will run here"
          echo "Image will be tagged with commit SHA: ${{ github.sha }}"

  # ── CSP ───────────────────────────────────────────────────────────────────
  # Gate chain: secret-scan → csp-compile → csp-tests → merge → csp-docker
  # Triggered only when CSP service files change.
  # Language: Scala / sbt
  # See ADR-009 for language selection rationale.

  csp-compile:
    name: CSP Compile
    runs-on: ubuntu-latest
    needs: secret-scan
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/csp')
    defaults:
