        working-directory: services/csp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run CSP tests
        run: echo "CSP tests will run here — placeholder until implementation begins"

  csp-docker:
    name: CSP Docker Build
    runs-on: ubuntu-latest
    needs: csp-tests
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CSP Docker image
        run: |
          echo "Docker build for CSP will run here"
          echo "Image will be tagged with commit SHA: ${{ github.sha }}"

  # ── SR ────────────────────────────────────────────────────────────────────
  # Gate chain: secret-scan → sr-compile → sr-tests → merge → sr-docker
  # Triggered only when SR service files change.
  # Language: Python
  # See ADR-009 for language selection rationale.

  sr-compile:
    name: SR Compile
    runs-on: ubuntu-latest
    needs: secret-scan
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/sr')
    defaults:
      run:
        working-directory: services/sr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile SR
        run: echo "python -m py_compile — placeholder until src files exist"

  sr-tests:
    name: SR Tests
    runs-on: ubuntu-latest
    needs: sr-compile
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/sr')
    defaults:
