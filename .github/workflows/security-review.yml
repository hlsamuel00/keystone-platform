# Security Review Pipeline — Keystone Platform
#
# Responsibilities:
#   - AI-assisted security domain review on every PR against main
#   - Reads platform-specific security constraints from .github/prompts/
#   - Posts structured review as a PR comment
#   - Acts as a required status check before merge
#
# Tools:
#   - CodeRabbit (GitHub App) — general code quality, installed separately
#   - Claude (Anthropic API) — security domain review, this workflow
#
# Gate order:
#   PR opened → security-review runs → result posted as PR comment
#
# See ADR-012 for AI-assisted code review decisions.
# See .github/prompts/security-review-prompt.md for review constraints.

name: Security Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:

  # ── Claude Security Review ─────────────────────────────────────────────────
  # Reads the security review prompt from .github/prompts/ and submits
  # the PR diff to the Anthropic API for security-domain analysis.
  # Posts findings as a structured PR comment.
  # See ADR-012 for rationale and tool selection.

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Generate PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Diff generated — $(wc -l < pr_diff.txt) lines"

      - name: Run Claude security review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYTHON'
          import anthropic
          import os
          import re

          # Load security review prompt
          with open(".github/prompts/security-review-prompt.md", "r") as f:
              system_prompt = f.read()

          # Load PR diff
          with open("pr_diff.txt", "r") as f:
              diff = f.read()

          # Truncate diff if too large — avoids exceeding context limits.
          # Cuts at file boundaries (diff --git markers) rather than mid-file,
          # so any included file is always reviewed in full.
          max_diff_chars = 250000
          if len(diff) > max_diff_chars:
              file_markers = [m.start() for m in re.finditer(r'^diff --git', diff, re.MULTILINE)]
              cutoff = max_diff_chars
              for marker in file_markers:
                  if marker > max_diff_chars:
                      break
                  cutoff = marker
              if cutoff == 0:
                  print(f"Error: first changed file exceeds max_diff_chars ({max_diff_chars}); cannot safely truncate. Review manually.")
                  exit(1)
              diff = diff[:cutoff] + "\n\n[Diff truncated — remaining files not shown, review manually]"

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
          try:
              message = client.messages.create(
                  model="claude-sonnet-4-6",
                  max_tokens=8192,
                  system=system_prompt,
                  messages=[
                      {
                          "role": "user",
                          "content": f"Please review the following PR diff against the platform security constraints:\n\n```diff\n{diff}\n```"
                      }
                  ]
              )

              # Fail closed on incomplete responses — stop_reason values other than
              # end_turn indicate the response was cut off (max_tokens) or declined
              # (refusal), and should not be posted to the PR as a complete review.
              if message.stop_reason not in ("end_turn", "stop_sequence"):
                  print(f"Error: response did not complete normally (stop_reason={message.stop_reason}).")
                  exit(1)

              # Response content may include a ThinkingBlock before the TextBlock
              # when adaptive/extended thinking is active — locate the text block
              # explicitly rather than assuming content[0] is text.
              review = next((block.text for block in message.content if block.type == "text"), None)
              if review is None:
                  print("Error: no text block found in Claude's response.")
                  exit(1)

          except anthropic.AnthropicError as e:
              print(f"Anthropic API error: {e}")
              exit(1)
          except Exception as e:
              print(f"Unexpected error during security review: {e}")
              exit(1)

          # Write review to file for next step
          with open("security_review.md", "w") as f:
              f.write("## Keystone Platform — Security Review\n\n")
              f.write("_Automated security-domain review powered by Claude._\n")
              f.write("_General code quality review provided by CodeRabbit._\n\n")
              f.write("---\n\n")
              f.write(review)

          print("Security review complete")
          PYTHON

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file security_review.md
